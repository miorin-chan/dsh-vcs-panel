# Activates the package: the Host `apply` registers the `/api/vcs.*` routes;
# the Client half is discovered through package.json `dsh.client`.
# `enabled: false` makes the Host apply return early and register no routes.
- insert:
    - id: dsh-vcs-panel
      name: '@miorin/dsh-vcs-panel'
      config:
        enabled: true
